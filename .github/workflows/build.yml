name: Build Clans Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем Java 25 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Собираем плагин через Maven
      run: mvn -B package --file pom.xml

    - name: Сохраняем готовый .jar в артефакты
      uses: actions/upload-artifact@v4
      with:
        name: ClansPlugin-Jar
        path: target/ClansPlugin.jar
